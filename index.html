<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Stownest Storage — Vehicle & Moving Cost Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=4" />
    <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png?v=4" />
    <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png?v=4" />
    <link rel="shortcut icon" href="assets/favicon-32.png?v=4" />
    <link rel="apple-touch-icon" href="assets/apple-touch.png?v=4" />
    <link rel="stylesheet" href="css/styles.css?v=6" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <img class="brand-icon" src="assets/box-icon.png?v=4" alt="" />
          <div>
            <h1 id="companyName">StowNest</h1>
            <p>Storage & Moving</p>
          </div>
        </div>
        <nav class="nav" id="mainNav">
          <div class="nav-label">Operations</div>
          <a href="#/" data-route="/"><span class="ico">▣</span> Home</a>
          <a href="#/calculator"><span class="ico">⌘</span> Quote Calculator</a>
          <div class="nav-label" data-admin>Sheet data (view only)</div>
          <a href="#/items" data-admin><span class="ico">▦</span> Item Master</a>
          <a href="#/vehicles" data-admin><span class="ico">▢</span> Vehicle Master</a>
          <a href="#/routes" data-admin><span class="ico">↦</span> Cities & Lanes</a>
          <a href="#/services" data-admin><span class="ico">＋</span> Extra Services</a>
          <a href="#/settings" data-admin><span class="ico">⚙</span> Settings & Users</a>
        </nav>
        <div class="sidebar-foot">
          <div id="whoami" class="help" style="color:#9cb9a8;margin-bottom:8px"></div>
          <button type="button" class="btn sm secondary" id="logoutBtn">Sign out</button>
        </div>
      </aside>
      <section class="main">
        <header class="topbar">
          <button type="button" class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
          <h2 id="pageTitle">Loading…</h2>
          <div class="meta" id="pageMeta"></div>
          <button type="button" class="btn sm secondary" id="refreshBtn" style="display:none">↻ Refresh from sheet</button>
        </header>
        <div class="nav-scrim" id="navScrim"></div>
        <div class="content" id="view"></div>
      </section>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils/helpers.js"></script>
    <script src="js/utils/calculations.js?v=2"></script>
    <script src="js/utils/quotePdf.js?v=8"></script>
    <script src="js/services/api.js?v=2"></script>
    <script src="js/services/auth.js?v=2"></script>
    <script src="js/services/data.js?v=3"></script>
    <script src="js/pages/login.js"></script>
    <script src="js/pages/dashboard.js"></script>
    <script src="js/pages/calculator.js?v=7"></script>
    <script src="js/pages/items.js?v=2"></script>
    <script src="js/pages/vehicles.js"></script>
    <script src="js/pages/routes.js?v=2"></script>
    <script src="js/pages/services.js"></script>
    <script src="js/pages/settings.js"></script>
    <script src="js/app.js?v=2"></script>
  </body>
</html>
